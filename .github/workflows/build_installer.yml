name: Build Installer

on:
  workflow_dispatch:
    inputs:
      test_build:
        description: 'Fast test build: reuse plugins from the last full build, skip Breakpad job, unit tests and docs'
        type: boolean
        default: false
      rebuild_usd_bridge:
        description: 'Rebuild the USD bridge (OpenUSD with MSVC) even if the release already has it'
        type: boolean
        default: false
      usd_tag:
        description: 'OpenUSD version for the bridge (git tag)'
        type: string
        default: 'v25.05'
      bridge_only:
        description: 'Only build / test the USD bridge (skip the installers)'
        type: boolean
        default: false
  push:
    paths-ignore:
      - 'tools/MINGW-packages/**'
      - '.github/workflows/build_pacman_repo.yml'

permissions:
  contents: write

env:
  NATRON_BUILD_WORKSPACE: 'D:/nbw'
  PLUGINS_CACHE_DIR: 'D:/nbw_plugins'
  PLUGINS_CACHE_KEY: 'natron-plugins-ucrt64'
  # Prebuilt third-party plugins (+ G'MIC source mirror) live in this release: it never
  # expires, unlike the Actions cache (deleted after 7 days without use).
  PLUGINS_RELEASE_TAG: 'windows-ucrt64-plugins'
  PLUGINS_ZIP: 'natron_plugins-ucrt64.zip'
  GMIC_SRC_DIR: 'D:/nbw_gmic_src'
  CI: 'True'
  TEST_BUILD: ${{ inputs.test_build && '1' || '0' }}

jobs:
  # USD bridge: OpenUSD built with Microsoft's compiler + solvusd. Built only when the release
  # 'windows-usd-bridge' does not have it yet (or on request): the installer just downloads it.
  usd-bridge:
    name: USD bridge (MSVC, only when missing)
    runs-on: windows-2022
    env:
      USD_TAG: ${{ inputs.usd_tag || 'v25.05' }}
      BRIDGE_RELEASE_TAG: 'windows-usd-bridge'
      BRIDGE_ZIP: 'solvfx_usd_bridge.zip'
    steps:
      - name: Is the bridge already published?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.rebuild_usd_bridge }}" != "true" ] && gh release view "${BRIDGE_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "${BRIDGE_ZIP}"; then
            echo "USD bridge already published: nothing to build."
            echo "build=false" >> $GITHUB_OUTPUT
          else
            echo "build=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout branch
        if: steps.check.outputs.build == 'true'
        uses: actions/checkout@v4.1.1

      - name: Set up Python
        if: steps.check.outputs.build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore OpenUSD build
        if: steps.check.outputs.build == 'true'
        id: usd-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\usd
          key: openusd-msvc-${{ env.USD_TAG }}-core-monolithic-v1

      - name: Build OpenUSD (core, monolithic, no imaging / python)
        if: steps.check.outputs.build == 'true' && steps.usd-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          git clone --depth 1 --branch %USD_TAG% https://github.com/PixarAnimationStudios/OpenUSD.git C:\usdsrc || exit /b 1
          python C:\usdsrc\build_scripts\build_usd.py --no-python --no-imaging --no-examples --no-tutorials --no-tools --no-docs --no-tests --no-materialx --build-monolithic -j %NUMBER_OF_PROCESSORS% C:\usd || exit /b 1

      - name: Save OpenUSD build (cache, so a later failure does not rebuild USD)
        if: steps.check.outputs.build == 'true' && steps.usd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\usd
          key: openusd-msvc-${{ env.USD_TAG }}-core-monolithic-v1

      - name: Build bridge
        if: steps.check.outputs.build == 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S tools\usdbridge -B C:\bb -G "Visual Studio 17 2022" -A x64 -Dpxr_DIR=C:\usd || exit /b 1
          cmake --build C:\bb --config Release || exit /b 1

      - name: Package
        if: steps.check.outputs.build == 'true'
        shell: pwsh
        run: |
          $d = "C:\pkg\usdbridge"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item C:\bb\Release\solvusd.dll $d
          Get-ChildItem C:\usd\lib\*.dll, C:\usd\bin\*.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "_debug|_preview|tbbmalloc_proxy" } | Copy-Item -Destination $d
          # USD plugins (file formats, schemas): next to usd_ms.dll, in "usd"
          Copy-Item -Recurse C:\usd\lib\usd "$d\usd"
          # MSVC runtime
          # MSVC runtime: the NEWEST versioned redist (code built with VS 17.10+ crashes at load with an older msvcp140)
          $redist = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC"
          $ver = Get-ChildItem $redist -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
                 Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $crt = Get-ChildItem "$($ver.FullName)\x64" -Directory -Filter "Microsoft.VC14*.CRT" | Select-Object -First 1
          Write-Host "MSVC runtime from: $($crt.FullName)"
          if ($crt) { Get-ChildItem "$($crt.FullName)\*.dll" | Copy-Item -Destination $d } else { Write-Host "MSVC runtime folder not found" }
          Get-ChildItem $d
          Compress-Archive -Path $d -DestinationPath "$env:RUNNER_TEMP\$env:BRIDGE_ZIP" -Force

      - name: Diagnose (load each DLL alone, list dependencies)
        if: steps.check.outputs.build == 'true'
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          public static class W {
            [DllImport("kernel32.dll", SetLastError=true, CharSet=CharSet.Unicode)] public static extern IntPtr LoadLibraryExW(string f, IntPtr h, uint flags);
          }
          "@
          $d = "C:\pkg\usdbridge"
          cmd /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" >nul && dumpbin /nologo /dependents $d\usd_ms.dll $d\solvusd.dll"
          Get-Item "$d\msvcp140.dll", "C:\Windows\System32\msvcp140.dll" | ForEach-Object { Write-Host ("{0}: {1}" -f $_.FullName, $_.VersionInfo.FileVersion) }
          foreach ($n in @("vcruntime140.dll","msvcp140.dll","tbb.dll","tbbmalloc.dll","usd_ms.dll","solvusd.dll")) {
            $h = [W]::LoadLibraryExW("$d\$n", [IntPtr]::Zero, 8)
            $e = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
            Write-Host ("load {0}: {1}" -f $n, $(if ($h -ne [IntPtr]::Zero) { "ok" } else { "FAILED error $e" }))
          }

      - name: Smoke test (write + read a file)
        if: steps.check.outputs.build == 'true'
        shell: pwsh
        run: |
          $src = @"
          #include <cstdio>
          #include <windows.h>
          typedef void* (*Open)(const char*, char*, int);
          typedef int (*Eval)(void*, double);
          typedef void* (*WB)(const char*, double, double, double, double, char*, int);
          typedef int (*WE)(void*, char*, int);
          int main() {
            HMODULE h = LoadLibraryExA("C:\\pkg\\usdbridge\\solvusd.dll", 0, LOAD_WITH_ALTERED_SEARCH_PATH);
            if (!h) { printf("load failed %lu\n", GetLastError()); return 1; }
            char e[512] = {0};
            WB wb = (WB)GetProcAddress(h, "solvusd_write_begin"); WE we = (WE)GetProcAddress(h, "solvusd_write_end");
            void* w = wb("C:\\pkg\\t.usdc", 1, 1, 24, 0.01, e, 512); if (!w) { printf("write: %s\n", e); return 2; }
            if (!we(w, e, 512)) { printf("end: %s\n", e); return 3; }
            Open op = (Open)GetProcAddress(h, "solvusd_open"); void* s = op("C:\\pkg\\t.usdc", e, 512);
            if (!s) { printf("open: %s\n", e); return 4; }
            printf("USD bridge OK\n"); return 0; }
          "@
          Set-Content -Path C:\pkg\smoke.cpp -Value $src
          cmd /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /EHsc C:\pkg\smoke.cpp /Fe:C:\pkg\smoke.exe && C:\pkg\smoke.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish to the release
        if: steps.check.outputs.build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${BRIDGE_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release create "${BRIDGE_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" --prerelease \
              --title "SOLVFX USD bridge (Windows, MSVC)" \
              --notes "OpenUSD ${USD_TAG} (core, monolithic) + solvusd bridge, added to every installer build (bin/usdbridge). Built by the 'Build USD Bridge' workflow. Do not delete."
          fi
          gh release upload "${BRIDGE_RELEASE_TAG}" "${RUNNER_TEMP}/${BRIDGE_ZIP}" --repo "${GITHUB_REPOSITORY}" --clobber

  win-installer:
    name: Windows Installer
    needs: usd-bridge
    if: ${{ !cancelled() && !inputs.bridge_only }}
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive

      - name: Install Windows system packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: git mingw-w64-ucrt-x86_64-wget unzip diffutils

      - name: Install Natron pacman repository
        run: |
          ${GITHUB_WORKSPACE}/.github/workflows/install_natron_pacman_repo.sh ${GITHUB_WORKSPACE} ${GITHUB_WORKSPACE}/natron_pacman_repo
          # MSYS2 mirrors are sometimes very slow: no low-speed timeout, and retry
          grep -q '^DisableDownloadTimeout' /etc/pacman.conf || sed -i 's/^\[options\]/[options]\nDisableDownloadTimeout/' /etc/pacman.conf
          for attempt in 1 2 3 4; do
            if pacman -S --needed --noconfirm --overwrite "*" ${MINGW_PACKAGE_PREFIX}-natron-build-deps-qt5 ${MINGW_PACKAGE_PREFIX}-python; then
              break
            fi
            echo "pacman failed (attempt ${attempt}), retrying in 20 s..."
            sleep 20
          done
          # Fail early if the deps meta-package could not be installed.
          pacman -Q ${MINGW_PACKAGE_PREFIX}-natron-build-deps-qt5
          # SOLVFX 3D: Alembic (optional: the build goes on without it)
          pacman -S --needed --noconfirm ${MINGW_PACKAGE_PREFIX}-alembic || echo "SOLVFX: Alembic not installed, building without it"
          pacman -Q ${MINGW_PACKAGE_PREFIX}-alembic ${MINGW_PACKAGE_PREFIX}-imath || true
          if [ ! -x ${MSYSTEM_PREFIX}/bin/python3.exe ] && [ -x ${MSYSTEM_PREFIX}/bin/python.exe ]; then cp ${MSYSTEM_PREFIX}/bin/python.exe ${MSYSTEM_PREFIX}/bin/python3.exe; fi
          which python3 && python3 --version

      - name: Download prebuilt plugins from the release (test build)
        id: release-plugins
        if: ${{ inputs.test_build }}
        run: |
          DIR=$(cygpath -u "${PLUGINS_CACHE_DIR}")
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${PLUGINS_RELEASE_TAG}/${PLUGINS_ZIP}"
          if wget -q "${URL}" -O "${RUNNER_TEMP}/plugins.zip" && [ -s "${RUNNER_TEMP}/plugins.zip" ]; then
            mkdir -p "${DIR}" && unzip -q -o "${RUNNER_TEMP}/plugins.zip" -d "${DIR}"
            ls "${DIR}"
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "No prebuilt plugins in the release yet: they will be built and published."
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore prebuilt plugins (test build, Actions cache fallback)
        id: restore-plugins
        if: ${{ inputs.test_build && steps.release-plugins.outputs.found != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PLUGINS_CACHE_DIR }}
          key: ${{ env.PLUGINS_CACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.PLUGINS_CACHE_KEY }}-

      - name: Build
        id: build
        run: |
          NATRON_BUILD_WORKSPACE_UNIX=$(cygpath -u ${NATRON_BUILD_WORKSPACE})
          mkdir ${NATRON_BUILD_WORKSPACE_UNIX}
          PLUGINS_CACHE_DIR_UNIX=$(cygpath -u ${PLUGINS_CACHE_DIR})
          export GMIC_MIRROR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${PLUGINS_RELEASE_TAG}"
          export GMIC_SRC_SAVE_DIR=$(cygpath -u ${GMIC_SRC_DIR})
          # remember whether the plugins were reused, to publish them only when freshly built
          ls -d ${PLUGINS_CACHE_DIR_UNIX}/*.ofx.bundle >/dev/null 2>&1 && touch ${RUNNER_TEMP}/plugins_reused || true

          cd tools/jenkins

          if [ "${TEST_BUILD}" = "1" ]; then
            # Fast test build: reuse plugins (rebuilt only if no cache), no unit tests, no docs.
            echo "*** Fast test build"
            BUILD_MODE_ENV="REUSE_PLUGINS_DIR=${PLUGINS_CACHE_DIR_UNIX} SAVE_PLUGINS_DIR=${PLUGINS_CACHE_DIR_UNIX} UNIT_TESTS=false SKIP_DOCS=1"
          else
            BUILD_MODE_ENV="SAVE_PLUGINS_DIR=${PLUGINS_CACHE_DIR_UNIX} UNIT_TESTS=true"
          fi

          env ${BUILD_MODE_ENV} PYV=3 WORKSPACE=${NATRON_BUILD_WORKSPACE_UNIX} BUILD_NAME=natron BUILD_NUMBER=1 BITS=64 NATRON_LICENSE=GPL GIT_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git GIT_URL_IS_NATRON=1 SNAPSHOT_BRANCH=${GITHUB_REF_NAME} QT_VERSION_MAJOR=5 DISABLE_BREAKPAD=1 NOUPDATE=1 MKJOBS=$(nproc) MINIMIZE_DISK_USAGE=1 ./launchBuildMain.sh

          ARCHIVE_DIR=${NATRON_BUILD_WORKSPACE_UNIX}/builds_archive/natron/1
          INSTALLER_ZIP_UNIX=$(ls ${ARCHIVE_DIR}/SOLVFX*Windows-x86_64.zip)

          # Unzip installer zip for artifact upload so we don't get a zipped zip file.
          cd ${ARCHIVE_DIR}
          INSTALLER_DIR="${ARCHIVE_DIR}/i"
          INSTALLER_NAME=$(basename ${INSTALLER_ZIP_UNIX} .zip)
          mkdir -p ${INSTALLER_DIR}
          cd ${INSTALLER_DIR}
          unzip ${INSTALLER_ZIP_UNIX}

          echo "INSTALLER_NAME=${INSTALLER_NAME}" >> $GITHUB_OUTPUT
          echo "INSTALLER_DIR=$(cygpath -m ${INSTALLER_DIR})" >> $GITHUB_OUTPUT
          echo "INSTALLER_ZIP=$(cygpath -m ${INSTALLER_ZIP_UNIX})" >> $GITHUB_OUTPUT

          TEST_RESULTS_FILE="${ARCHIVE_DIR}/${INSTALLER_NAME}-tests.txt"
          TEST_RESULTS_NAME="${INSTALLER_NAME}-tests"
          echo "TEST_RESULTS_NAME=${TEST_RESULTS_NAME}" >> $GITHUB_OUTPUT
          echo "TEST_RESULTS_FILE=$(cygpath -m ${TEST_RESULTS_FILE})" >> $GITHUB_OUTPUT

          TEST_FAILURES_DIR="${ARCHIVE_DIR}/${INSTALLER_NAME}-unit_tests_failures"
          TEST_FAILURES_NAME="${INSTALLER_NAME}-unit_tests_failures"
          echo "TEST_FAILURES_NAME=${TEST_FAILURES_NAME}" >> $GITHUB_OUTPUT
          echo "TEST_FAILURES_DIR=$(cygpath -m ${TEST_FAILURES_DIR})" >> $GITHUB_OUTPUT

      - name: Add the USD bridge (prebuilt with MSVC by the usd-bridge job)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="${RUNNER_TEMP}/solvfx_usd_bridge.zip"
          if ! gh release download windows-usd-bridge --repo "${GITHUB_REPOSITORY}" --pattern solvfx_usd_bridge.zip --dir "${RUNNER_TEMP}" --clobber; then
            echo "SOLVFX: no USD bridge release yet: building without USD."
            exit 0
          fi
          NAME="${{ steps.build.outputs.INSTALLER_NAME }}"
          IDIR="${{ steps.build.outputs.INSTALLER_DIR }}"
          BIN="${IDIR}/${NAME}/bin"
          [ -d "${BIN}" ] || { echo "SOLVFX: ${BIN} not found"; exit 0; }
          7z x -y -bd -o"${BIN}" "${ZIP}" > /dev/null
          ls "${BIN}/usdbridge" | head
          # repack the installer zip with the bridge inside
          INSTALLER_ZIP="${{ steps.build.outputs.INSTALLER_ZIP }}"
          rm -f "${INSTALLER_ZIP}"
          (cd "${IDIR}" && 7z a -tzip -bd "${INSTALLER_ZIP}" "${NAME}" > /dev/null)
          ls -la "${INSTALLER_ZIP}"

      - name: Publish built plugins to the release
        # Full builds always refresh it; a test build publishes only plugins it had to build.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${TEST_BUILD}" = "1" ] && [ -f "${RUNNER_TEMP}/plugins_reused" ]; then
            echo "Plugins were reused: nothing to publish."
            exit 0
          fi
          DIR="${PLUGINS_CACHE_DIR}"
          if ! ls -d "${DIR}"/*.ofx.bundle >/dev/null 2>&1; then
            echo "No built plugins found in ${DIR}"
            exit 0
          fi
          if ! gh release view "${PLUGINS_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release create "${PLUGINS_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" --prerelease \
              --title "SOLVFX UCRT64 prebuilt plugins" \
              --notes "Third-party OFX plugin bundles reused by fast test builds, plus a G'MIC source mirror. Updated by the 'Build Installer' workflow. Do not delete."
          fi
          (cd "${DIR}" && rm -f "${RUNNER_TEMP}/${PLUGINS_ZIP}" && 7z a -tzip -bd "${RUNNER_TEMP}/${PLUGINS_ZIP}" ./*.ofx.bundle > /dev/null)
          gh release upload "${PLUGINS_RELEASE_TAG}" "${RUNNER_TEMP}/${PLUGINS_ZIP}" --repo "${GITHUB_REPOSITORY}" --clobber
          for f in "${GMIC_SRC_DIR}"/gmic_*.tar.gz; do
            [ -s "$f" ] && gh release upload "${PLUGINS_RELEASE_TAG}" "$f" --repo "${GITHUB_REPOSITORY}" --clobber || true
          done

      - name: Build verify_plugin_loads binary
        run: |
          g++ -DWINDOWS -o verify_plugin_loads .github/workflows/verify_plugin_loads.cpp libs/OpenFX/HostSupport/src/ofxhBinary.cpp libs/OpenFX/HostSupport/src/ofxhUtilities.cpp -I libs/OpenFX/HostSupport/include/ -I libs/OpenFX/include/

      - name: Uninstall Natron dependencies
        run: |
          pacman -Rs --noconfirm ${MINGW_PACKAGE_PREFIX}-natron-build-deps-qt5

      - name: Upload test results
        if: ${{ !inputs.test_build }}
        uses: actions/upload-artifact@v4.3.1
        with:
          name:  ${{ steps.build.outputs.TEST_RESULTS_NAME }}
          path:  ${{ steps.build.outputs.TEST_RESULTS_FILE }}
          retention-days: 1

      - name: Upload test failures
        if: ${{ !inputs.test_build }}
        uses: actions/upload-artifact@v4.3.1
        with:
          name:  ${{ steps.build.outputs.TEST_FAILURES_NAME }}
          path:  ${{ steps.build.outputs.TEST_FAILURES_DIR }}
          retention-days: 1

      - name: Verify plugin loading
        run: |
          INSTALLER_DIR=$(cygpath -u '${{ steps.build.outputs.INSTALLER_DIR }}')/${{ steps.build.outputs.INSTALLER_NAME }}
          for x in $(find ${INSTALLER_DIR}/Plugins -name *.ofx); do
            echo "Testing $(basename ${x}) ..."
            PATH=${INSTALLER_DIR}/bin ./verify_plugin_loads.exe "${x}"
          done

      - name: Publish installer to a release
        # Installers go to GitHub Releases (not counted in Actions storage) as pre-releases.
        # Older ones are never deleted here: they are removed by hand once the new build is confirmed.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="${{ steps.build.outputs.INSTALLER_NAME }}"
          TAG="build-${NAME}"
          gh release create "${TAG}" "${{ steps.build.outputs.INSTALLER_ZIP }}" --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" --prerelease \
            --title "${NAME}" \
            --notes "SOLVFX build from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER}$([ "${TEST_BUILD}" = "1" ] && echo ', fast test build'))."

      - name: Verify passing tests match 2.5.0 release
        # Informational only: the toolchain differs from the 2.5.0 release build.
        if: ${{ !inputs.test_build }}
        continue-on-error: true
        run: |
          wget https://github.com/NatronGitHub/Natron/releases/download/v2.5.0/Natron-2.5.0-Windows-x86_64-tests.txt
          if diff Natron-2.5.0-Windows-x86_64-tests.txt ${{ steps.build.outputs.TEST_RESULTS_FILE }}; then
            echo "Test results match 2.5.0 release : PASS"
          else
            echo "Test results match 2.5.0 release : FAILED"
            exit 1
          fi

  win-installer-breakpad:
    name: Windows Installer (with Breakpad crash reporting)
    if: ${{ !inputs.test_build && !inputs.bridge_only }}
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive

      - name: Install Windows system packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: git mingw-w64-ucrt-x86_64-wget unzip

      - name: Install Natron pacman repository
        run: |
          ${GITHUB_WORKSPACE}/.github/workflows/install_natron_pacman_repo.sh ${GITHUB_WORKSPACE} ${GITHUB_WORKSPACE}/natron_pacman_repo
          # MSYS2 mirrors are sometimes very slow: no low-speed timeout, and retry
          grep -q '^DisableDownloadTimeout' /etc/pacman.conf || sed -i 's/^\[options\]/[options]\nDisableDownloadTimeout/' /etc/pacman.conf
          for attempt in 1 2 3 4; do
            if pacman -S --needed --noconfirm --overwrite "*" ${MINGW_PACKAGE_PREFIX}-natron-build-deps-qt5 ${MINGW_PACKAGE_PREFIX}-python; then
              break
            fi
            echo "pacman failed (attempt ${attempt}), retrying in 20 s..."
            sleep 20
          done
          # Fail early if the deps meta-package could not be installed.
          pacman -Q ${MINGW_PACKAGE_PREFIX}-natron-build-deps-qt5
          # SOLVFX 3D: Alembic (optional: the build goes on without it)
          pacman -S --needed --noconfirm ${MINGW_PACKAGE_PREFIX}-alembic || echo "SOLVFX: Alembic not installed, building without it"
          pacman -Q ${MINGW_PACKAGE_PREFIX}-alembic ${MINGW_PACKAGE_PREFIX}-imath || true
          if [ ! -x ${MSYSTEM_PREFIX}/bin/python3.exe ] && [ -x ${MSYSTEM_PREFIX}/bin/python.exe ]; then cp ${MSYSTEM_PREFIX}/bin/python.exe ${MSYSTEM_PREFIX}/bin/python3.exe; fi
          which python3 && python3 --version

      - name: Build
        id: build
        run: |
          NATRON_BUILD_WORKSPACE_UNIX=$(cygpath -u ${NATRON_BUILD_WORKSPACE})
          mkdir ${NATRON_BUILD_WORKSPACE_UNIX}

          cd tools/jenkins

          PYV=3 WORKSPACE=${NATRON_BUILD_WORKSPACE_UNIX} BUILD_NAME=natron BUILD_NUMBER=1 BITS=64 NATRON_LICENSE=GPL GIT_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git GIT_URL_IS_NATRON=1 SNAPSHOT_BRANCH=${GITHUB_REF_NAME} QT_VERSION_MAJOR=5 NOUPDATE=1 MKJOBS=$(nproc) MINIMIZE_DISK_USAGE=1 ./launchBuildMain.sh

          ARCHIVE_DIR=${NATRON_BUILD_WORKSPACE_UNIX}/builds_archive/natron/1
          INSTALLER_ZIP_UNIX=$(ls ${ARCHIVE_DIR}/SOLVFX*-breakpad.zip)

          set -x
          # Unzip installer zip for artifact upload so we don't get a zipped zip file.
          cd ${ARCHIVE_DIR}
          INSTALLER_DIR="${ARCHIVE_DIR}/i"
          INSTALLER_NAME=$(basename ${INSTALLER_ZIP_UNIX} .zip)
          mkdir -p ${INSTALLER_DIR}
          cd ${INSTALLER_DIR}
          unzip ${INSTALLER_ZIP_UNIX}

          echo "INSTALLER_NAME=${INSTALLER_NAME}" >> $GITHUB_OUTPUT
          echo "INSTALLER_DIR=$(cygpath -m ${INSTALLER_DIR})" >> $GITHUB_OUTPUT

          SYMBOLS_NAME="${INSTALLER_NAME}-symbols"
          SYMBOLS_DIR="${ARCHIVE_DIR}/s"
          cd ${ARCHIVE_DIR}
          mv symbols ${SYMBOLS_NAME}
          mkdir ${SYMBOLS_DIR}
          mv ${SYMBOLS_NAME} ${SYMBOLS_DIR}

          echo "SYMBOLS_NAME=${SYMBOLS_NAME}" >> $GITHUB_OUTPUT
          echo "SYMBOLS_DIR=$(cygpath -m ${SYMBOLS_DIR})" >> $GITHUB_OUTPUT

      - name: Build verify_plugin_loads binary
        run: |
          g++ -DWINDOWS -o verify_plugin_loads .github/workflows/verify_plugin_loads.cpp libs/OpenFX/HostSupport/src/ofxhBinary.cpp libs/OpenFX/HostSupport/src/ofxhUtilities.cpp -I libs/OpenFX/HostSupport/include/ -I libs/OpenFX/include/

      - name: Uninstall Natron dependencies
        run: |
          pacman -Rs --noconfirm ${MINGW_PACKAGE_PREFIX}-natron-build-deps-qt5

      - name: Verify plugin loading
        run: |
          INSTALLER_DIR=$(cygpath -u '${{ steps.build.outputs.INSTALLER_DIR }}')/${{ steps.build.outputs.INSTALLER_NAME }}
          for x in $(find ${INSTALLER_DIR}/Plugins -name *.ofx); do
            echo "Testing $(basename ${x}) ..."
            PATH=${INSTALLER_DIR}/bin ./verify_plugin_loads.exe "${x}"
          done
