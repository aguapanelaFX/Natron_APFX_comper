name: Build pacman repo

# Builds Natron's own MSYS2 dependency packages (OpenImageIO, FFmpeg, OCIO, ...)
# for the UCRT64 environment and publishes them as the release asset
# "natron_package_repo-ucrt64.zip" under the tag below, where the
# "Build Installer" workflow downloads them from.

on:
  workflow_dispatch:
    inputs:
      clean:
        description: 'Ignore the cache and rebuild every package'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'tools/MINGW-packages/**'
      - '.github/workflows/build_pacman_repo.yml'
  push:
    paths:
      - 'tools/MINGW-packages/**'
      - '.github/workflows/build_pacman_repo.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  cache-name: cache-natron-repo-ucrt64-v2
  REPO_RELEASE_TAG: windows-ucrt64-package-repo
  REPO_ZIP: natron_package_repo-ucrt64.zip

jobs:
  build_repo:
    name: Build pacman repo (UCRT64)
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive
      - name: Setup MSYS2 UCRT64 environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: git base-devel zip
      - name: Install Inno Setup
        run: choco install innosetup
        shell: pwsh
      - name: Restore natron repo directory from cache
        id: restore-natron-repo-cache
        # Only packages whose recipe (or a rebuilt dependency) changed get rebuilt;
        # see tools/MINGW-packages/build_natron_package_repo.sh.
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@v4
        with:
          path: natron_repo
          key: ${{ env.cache-name }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.cache-name }}-
      - name: Build natron package repo
        id: build-package-repo
        # Allow continuing after error so cache gets updated and makes reruns faster.
        continue-on-error: true
        run: |
          tools/MINGW-packages/build_natron_package_repo.sh natron_repo
      - name: Save natron repo directory to cache
        id: save-natron-repo-cache
        uses: actions/cache/save@v4
        # save even if build fails.
        if: always()
        with:
          path: natron_repo
          key: ${{ env.cache-name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check on failures
        if: steps.build-package-repo.outcome != 'success'
        run: exit 1
      - name: Zip natron package repo
        run: |
          cd natron_repo
          rm -f "../${REPO_ZIP}"
          zip -r "../${REPO_ZIP}" . -x '.recipes/*'
      - name: Upload natron_package_repo artifact
        uses: actions/upload-artifact@v4.3.1
        with:
          name: natron_package_repo-ucrt64
          path: ${{ env.REPO_ZIP }}
      - name: Publish natron package repo release asset
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${REPO_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release create "${REPO_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" --prerelease \
              --title "Natron UCRT64 dependency package repo" \
              --notes "MSYS2 UCRT64 packages used to build Natron on Windows. Updated by the 'Build pacman repo' workflow."
          fi
          gh release upload "${REPO_RELEASE_TAG}" "${REPO_ZIP}" --repo "${GITHUB_REPOSITORY}" --clobber
